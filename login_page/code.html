<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockMaster Enterprise Login</title>
    <meta
        name="description"
        content="Sign in to StockMaster Enterprise Inventory Management System."
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    >

    <!-- Tailwind CSS - Frontend Prototype -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",

            theme: {
                extend: {
                    colors: {
                        "primary": "#004ac6",
                        "primary-container": "#2563eb",
                        "on-primary": "#ffffff",

                        "on-surface": "#191b23",
                        "on-surface-variant": "#586377",

                        "surface": "#faf8ff",
                        "surface-container-low": "#f3f3fe",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ededf9",
                        "surface-container-highest": "#e1e2ed",

                        "outline": "#737686",
                        "outline-variant": "#c3c6d7",

                        "error": "#ba1a1a",
                        "error-container": "#ffdad6"
                    },

                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },

                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px"
                    },

                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #f8fafc;
            font-family: "Inter", sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings:
                "FILL" 0,
                "wght" 400,
                "GRAD" 0,
                "opsz" 24;
        }

        .floating-label-group {
            position: relative;
        }

        .floating-label-group input {
            background-color: #ffffff;
        }

        .floating-label-group label {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            pointer-events: none;
            color: #94a3b8;
            background-color: transparent;
            transition:
                top 0.2s ease,
                left 0.2s ease,
                transform 0.2s ease,
                font-size 0.2s ease,
                color 0.2s ease,
                background-color 0.2s ease;
        }

        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 10px;
            transform: translateY(-50%);
            padding: 0 4px;
            background-color: #ffffff;
            color: #004ac6;
            font-size: 11px;
        }

        .floating-label-group input[aria-invalid="true"] ~ label {
            color: #ba1a1a;
        }

        .floating-label-group input[aria-invalid="true"]:focus ~ label {
            color: #ba1a1a;
        }

        .focus-visible-ring:focus-visible {
            outline: 2px solid #004ac6;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <main
        class="relative z-10 w-full max-w-[400px]"
        aria-labelledby="loginTitle"
    >

        <!-- Login Card -->
        <section
            class="bg-surface-container-lowest rounded-xl
                   shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)]
                   border border-outline-variant/30
                   p-6 sm:p-8"
        >

            <!-- Brand -->
            <header class="flex flex-col items-center mb-8">

                <div
                    class="w-12 h-12 bg-primary-container/10 rounded-lg
                           flex items-center justify-center mb-4"
                    aria-hidden="true"
                >
                    <span
                        class="material-symbols-outlined text-primary text-[32px]"
                    >
                        inventory
                    </span>
                </div>

                <h1
                    id="loginTitle"
                    class="text-2xl font-semibold text-on-surface mb-1"
                >
                    StockMaster
                </h1>

                <p class="text-sm text-on-surface-variant">
                    Welcome back
                </p>
            </header>

            <!-- Login Form -->
           <form id="loginForm" class="space-y-6" method="post" novalidate>

                <!-- Email -->
                <div class="floating-label-group">

                    <input
                        class="w-full h-12 px-4
                               font-sans text-sm text-on-surface
                               border border-outline-variant
                               rounded-lg
                               focus:outline-none
                               focus:ring-2 focus:ring-primary/20
                               focus:border-primary
                               transition-all"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="username"
                        inputmode="email"
                        placeholder=" "
                        maxlength="254"
                        required
                        aria-describedby="emailError"
                    >

                    <label for="email">
                        Email Address
                    </label>

                    <p
                        id="emailError"
                        class="hidden mt-1 text-xs text-red-600"
                        role="alert"
                    ></p>
                </div>

                <!-- Password -->
                <div class="floating-label-group relative">

                    <input
                        class="w-full h-12 px-4 pr-12
                               font-sans text-sm text-on-surface
                               border border-outline-variant
                               rounded-lg
                               focus:outline-none
                               focus:ring-2 focus:ring-primary/20
                               focus:border-primary
                               transition-all"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder=" "
                        maxlength="128"
                        required
                        aria-describedby="passwordError"
                    >

                    <label for="password">
                        Password
                    </label>

                    <!-- Password Toggle -->
                    <button
                        id="togglePassword"
                        class="focus-visible-ring
                               absolute right-3 top-1/2
                               -translate-y-1/2
                               text-on-surface-variant
                               hover:text-primary
                               transition-colors
                               rounded"
                        type="button"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <span
                            id="eyeIcon"
                            class="material-symbols-outlined"
                            aria-hidden="true"
                        >
                            visibility
                        </span>
                    </button>

                    <p
                        id="passwordError"
                        class="hidden mt-1 text-xs text-red-600"
                        role="alert"
                    ></p>
                </div>

                <!-- Remember / Forgot -->
                <div class="flex items-center justify-between gap-4">

                    <label class="flex items-center cursor-pointer group">

                        <input
                            id="rememberMe"
                            name="remember_me"
                            type="checkbox"
                            value="1"
                            class="h-4 w-4 cursor-pointer
                                   rounded border-outline-variant
                                   text-primary
                                   focus:ring-primary"
                        >

                        <span
                            class="ml-2 text-xs sm:text-sm
                                   text-on-surface-variant
                                   group-hover:text-on-surface"
                        >
                            Remember me
                        </span>

                    </label>

                    <button
                        id="forgotPasswordButton"
                        type="button"
                        class="focus-visible-ring
                               text-xs sm:text-sm
                               font-semibold
                               text-primary
                               hover:text-blue-800
                               rounded"
                    >
                        Forgot password?
                    </button>

                </div>

                <!-- General Feedback -->
                <div
                    id="formFeedback"
                    class="hidden rounded-lg border px-4 py-3 text-sm"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></div>

                <!-- Submit -->
                <button
                    id="submitButton"
                    class="w-full h-12
                           bg-primary
                           text-on-primary
                           font-semibold
                           text-sm
                           rounded-lg
                           shadow-sm
                           hover:bg-blue-800
                           active:scale-[0.98]
                           disabled:opacity-60
                           disabled:cursor-not-allowed
                           transition-all duration-200
                           flex items-center justify-center gap-2
                           focus-visible-ring"
                    type="submit"
                >
                    <span id="submitText">
                        Sign In
                    </span>

                    <span
                        id="submitIcon"
                        class="material-symbols-outlined text-sm"
                        aria-hidden="true"
                    >
                        arrow_forward
                    </span>
                </button>

            </form>

            <!-- Password Reset Panel -->
            <section
                id="resetPanel"
                class="hidden mt-6 rounded-lg
                       border border-primary/20
                       bg-surface-container-low
                       p-4"
                aria-labelledby="resetTitle"
            >

                <div class="flex items-center gap-2 mb-2">

                    <span
                        class="material-symbols-outlined text-primary"
                        aria-hidden="true"
                    >
                        lock_reset
                    </span>

                    <h2
                        id="resetTitle"
                        class="text-sm font-semibold text-on-surface"
                    >
                        Reset password
                    </h2>

                </div>

                <p class="mb-3 text-sm text-on-surface-variant">
                    Enter your email address to request password
                    recovery instructions.
                </p>

                <form
                    id="resetForm"
                    class="space-y-3"
                    novalidate
                >

                    <input
                        id="resetEmail"
                        name="reset_email"
                        class="w-full h-11 px-4
                               text-sm text-on-surface
                               border border-outline-variant
                               rounded-lg
                               focus:outline-none
                               focus:ring-2 focus:ring-primary/20
                               focus:border-primary"
                        type="email"
                        autocomplete="email"
                        inputmode="email"
                        placeholder="Email address"
                        maxlength="254"
                        required
                    >

                    <div class="flex gap-2">

                        <button
                            id="closeResetButton"
                            type="button"
                            class="flex-1 h-10
                                   border border-outline-variant
                                   text-on-surface-variant
                                   text-sm font-medium
                                   rounded-lg
                                   hover:bg-slate-100
                                   transition-colors"
                        >
                            Cancel
                        </button>

                        <button
                            id="resetSubmitButton"
                            type="submit"
                            class="flex-1 h-10
                                   bg-primary
                                   text-on-primary
                                   text-sm font-semibold
                                   rounded-lg
                                   hover:bg-blue-800
                                   disabled:opacity-60
                                   disabled:cursor-not-allowed
                                   transition-colors"
                        >
                            Send Request
                        </button>

                    </div>

                </form>

            </section>

            <!-- Support -->
            <footer class="mt-8 pt-6 border-t border-outline-variant/30">

                <p class="text-center text-sm text-on-surface-variant mb-4">
                    Don't have an account?
                </p>

                <button
                    id="supportButton"
                    type="button"
                    class="w-full h-11
                           bg-surface-container-low
                           border border-outline-variant
                           text-on-surface-variant
                           font-medium
                           text-sm
                           rounded-lg
                           hover:bg-surface-container
                           transition-colors
                           focus-visible-ring"
                >
                    Contact Enterprise Support
                </button>

            </footer>

        </section>

        <!-- Copyright -->
        <p class="text-center mt-6 text-xs text-outline">
            © 2026 StockMaster Enterprise. All rights reserved.
        </p>

    </main>

    <script src="login.js" defer></script>

</body>
</html>
